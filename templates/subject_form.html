{% extends 'base.html' %}{% block title %}{{ 'Edit Subject' if subject else 'New Subject' }}{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">CURRICULUM</p><h1>{{ 'Edit subject' if subject else 'Add subject' }}</h1><p class="muted">Keep curriculum information clear and consistent.</p></div></div><form method="post" class="form-card"><div class="row g-4"><div class="col-md-7"><label>Subject name</label><input name="name" value="{{ subject.name if subject else '' }}" required placeholder="e.g. Mathematics"></div><div class="col-md-5"><label>Subject code</label><input name="code" value="{{ subject.code if subject else '' }}" required placeholder="e.g. MATH-08"></div><div class="col-md-5"><label>Grade level</label><select name="grade_level">{% for grade in range(1,13) %}<option value="{{ grade }}" {% if subject and subject.grade_level == grade %}selected{% endif %}>Grade {{ grade }}</option>{% endfor %}</select></div><div class="col-12"><label>Description</label><textarea name="description" rows="4" placeholder="What does this subject cover?">{{ subject.description if subject else '' }}</textarea></div></div><div class="form-actions"><a href="{{ url_for('subjects') }}" class="btn btn-light">Cancel</a><button class="btn btn-primary">{{ 'Save changes' if subject else 'Create subject' }} <i class="fa-solid fa-arrow-right"></i></button></div></form>{% endblock %}
