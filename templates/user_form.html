{% extends 'base.html' %}{% block title %}{{ 'Edit User' if user else 'New User' }}{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">PEOPLE & PERMISSIONS</p><h1>{{ 'Edit user' if user else 'Add user' }}</h1><p class="muted">Set identity, role, and account access.</p></div></div><form method="post" class="form-card"><div class="row g-4"><div class="col-md-6"><label>Full name</label><input name="full_name" value="{{ user.full_name if user else '' }}" required placeholder="Full name"></div><div class="col-md-6"><label>Email address</label><input type="email" name="email" value="{{ user.email if user else '' }}" required placeholder="name@example.com"></div><div class="col-md-4"><label>Role</label><select name="role"><option value="student" {% if user and user.role == 'student' %}selected{% endif %}>Student</option><option value="teacher" {% if user and user.role == 'teacher' %}selected{% endif %}>Teacher</option><option value="admin" {% if user and user.role == 'admin' %}selected{% endif %}>Administrator</option></select></div><div class="col-md-4"><label>Grade level</label><select name="grade_level"><option value="">Not applicable</option>{% for grade in range(1,13) %}<option value="{{ grade }}" {% if user and user.grade_level == grade %}selected{% endif %}>Grade {{ grade }}</option>{% endfor %}</select></div><div class="col-md-4"><label>{{ 'New password (optional)' if user else 'Password' }}</label><input type="password" name="password" {% if not user %}required{% endif %} placeholder="At least 8 characters"></div></div><div class="form-actions"><a href="{{ url_for('users') }}" class="btn btn-light">Cancel</a><button class="btn btn-primary">{{ 'Save changes' if user else 'Create user' }} <i class="fa-solid fa-arrow-right"></i></button></div></form>{% endblock %}
